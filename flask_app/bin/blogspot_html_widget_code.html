<style>
        /*colapsable container*/
        /* Reset button styling & align items */
        .search-toggle {
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Icon Container Context */
        .icon-container {
            position: relative;
            width: 24px;
            height: 24px;
        }

        /* 1. The Glass Lens (Circle) */
        .icon-container .lens {
            position: absolute;
            top: 2px;
            left: 2px;
            width: 14px;
            height: 14px;
            border: 3px solid #333;
            border-radius: 50%;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        /* 2. The Stick Handle (Diagonal line) */
        .icon-container .handle {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 3px;
            height: 9px;
            background-color: #333;
            transform: rotate(-45deg);
            transform-origin: bottom right;
            transition: all 0.3s ease;
        }

        /* Text Label */
        .toggle-text {
            font-family: sans-serif;
            font-size: 16px;
            color: #333;
            user-select: none;
        }

        /* ---- MORPHING TRANSFORMS (When Menu is Open) ---- */

        /* Lens flattens out into one line of the X */
        .search-toggle.open .lens {
            border-radius: 0;
            width: 3px;
            height: 22px;
            border: none;
            background-color: #333;
            top: 1px;
            left: 11px;
            transform: rotate(45deg);
        }

        /* Handle elongates and rotates into the opposing line of the X */
        .search-toggle.open .handle {
            height: 22px;
            bottom: 1px;
            right: 11px;
            transform: rotate(-45deg);
            transform-origin: center;
        }

        /* ---- COLLAPSIBLE CONTAINER ---- */
        .menu-content {
            display: none;
            background-color: #f9f9f9;
            padding: 15px;
            border: 1px solid #ddd;
            margin-top: 10px;
        }

        .menu-show {
            display: block !important;
        }
        /* search container */
        .search-container {
            max-width: 90%;
            margin: 40px auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

                .search-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 2;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
        }
        .search-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 2;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
        }

        select {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: #fff;
            cursor: pointer;
            outline: none;
        }

        .search-btn {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .search-btn:hover {
            background-color: var(--accent-hover);
        }

        input:focus, select:focus {
            border-color: var(--accent-color);
        }

        .status-bar {
            font-size: 14px;
            color: #666;
            margin-bottom: 15px;
            font-weight: 600;
        }

        #resultsTarget {
            max-height: 450px;
            overflow-y: auto;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }

        .result-item {
            padding: 12px 8px;
            border-bottom: 1px solid #f1f1f1;
            transition: background 0.2s;
        }

        .result-item:hover {
            background-color: #fdfdfd;
        }

        .result-link {
            color: var(--accent-color);
            text-decoration: none;
            font-size: 17px;
            font-weight: 500;
            display: block;
        }

        .result-link:hover {
            color: var(--primary-color);
            text-decoration: underline;
        }

        #resultsTarget::-webkit-scrollbar {
            width: 6px;
        }
        #resultsTarget::-webkit-scrollbar-thumb {
            background-color: #ccc;
            border-radius: 4px;
        }

        @media (max-width: 600px) {
            .search-controls {
                flex-direction: column;
            }
        }
    </style>
    <button class="search-toggle" id="menuBtn" onclick="toggleMenu()" aria-expanded="false" aria-controls="collapsibleMenu">
        <div class="icon-container">
            <span class="lens"></span>
            <span class="handle"></span>
        </div>
        <span class="toggle-text">Search ...</span>
    </button>
    <div  id="collapsibleMenu" class="menu-content" style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; max-width: 100%;">

        <div class="search-container">
            <!-- <h1>Global Warming Archive Search</h1> -->
            
	<iframe 
    		src="https://globalwarming-arclein.duckdns.org/" 
    		style="width: 100%; height: 800px; border: none; overflow: auto;"
    		allow="autoplay">
	</iframe>
            <div class="status-bar" id="statusMessage">Loading index...</div>
            
            <div id="resultsTarget"></div>
        </div>
    </div>

    <script>
        /* */
        function toggleMenu() {
            var menu = document.getElementById("collapsibleMenu");
            var btn = document.getElementById("menuBtn");
            
            var isOpen = menu.classList.toggle("menu-show");
            btn.classList.toggle("open");
            
            btn.setAttribute("aria-expanded", isOpen);
        }
        /* */
        let categorizedData = {};
        const BLOG_BASE_URL = "https://globalwarming-arclein.blogspot.com";

        const textSearch = document.getElementById('textSearch');
        const categoryDropdown = document.getElementById('categoryDropdown');
        const resultsTarget = document.getElementById('resultsTarget');
        const statusMessage = document.getElementById('statusMessage');

        async function initSearchEngine() {
            try {
                const response = await fetch('https://srwing.github.io/terraformingterra-ui/clean_labels.json');
                if (!response.ok) throw new Error("Could not load data map file.");
                
                categorizedData = await response.json();
                
                buildDropdownOptions();
                executeSearch(); // Show everything initially
                
                categoryDropdown.addEventListener('change', executeSearch);
                
            } catch (error) {
                console.error(error);
                statusMessage.textContent = "Error loading search data index.";
            }
        }

        function buildDropdownOptions() {
            const sortedCategories = Object.keys(categorizedData).sort();
            
            sortedCategories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = `${cat} (${categorizedData[cat].length})`;
                categoryDropdown.appendChild(opt);
            });
        }

        function handleFormSubmit(event) {
            event.preventDefault(); 
            executeSearch();
        }

        function executeSearch() {
            const query = textSearch.value.toLowerCase().trim();
            const selectedCat = categoryDropdown.value;
            
            let pool = [];

            if (selectedCat) {
                pool = categorizedData[selectedCat];
            } else {
                const seenTitles = new Set();
                Object.values(categorizedData).forEach(articlesList => {
                    articlesList.forEach(article => {
                        if (!seenTitles.has(article.title)) {
                            seenTitles.add(article.title);
                            pool.push(article);
                        }
                    });
                });
                pool.sort((a, b) => a.title.localeCompare(b.title));
            }

            if (query) {
                pool = pool.filter(article => article.title.toLowerCase().includes(query));
            }

            renderToDiv(pool);
        }

        // HELPER: Auto-generates a clean Blogspot URL path based safely on the post's title
        function generateBloggerUrl(title) {
            return `${BLOG_BASE_URL}/search?q=${encodeURIComponent(title)}`;
        }

        function renderToDiv(articles) {
            resultsTarget.innerHTML = '';
            statusMessage.textContent = `Found ${articles.length} matching articles`;

            if (articles.length === 0) {
                resultsTarget.innerHTML = '<p style="text-align:center; color:#999; margin-top:20px;">No matching articles found.</p>';
                return;
            }

            articles.forEach(article => {
                const item = document.createElement('div');
                item.className = 'result-item';
                
                // Reconstructed Live Link
                const dynamicUrl = generateBloggerUrl(article.title);
                
                item.innerHTML = `
                    <a class="result-link" href="${dynamicUrl}" target="_blank">${article.title}</a>
                `;
                resultsTarget.appendChild(item);
            });
        }

        initSearchEngine();
    </script>
