

<button class="search-toggle" id="menuBtn" onclick="toggleMenu()" aria-expanded="false" aria-controls="collapsibleMenu">
            <div class="icon-container">
                <span class="lens"></span>
                <span class="handle"></span>
            </div>
            <span class="toggle-text">Search ...</span>
        </button>

        <!-- The Collapsible Container -->
        <div id="collapsibleMenu" class="menu-content">
            <script async src="https://cse.google.com/cse.js?cx=d6e66471519be4d46"></script>
            <div class="gcse-search"></div>
        </div>

        <style>
            /* Reset button styling & align items */
            .search-toggle {
                background: none;
                border: none;
                padding: 0;
                cursor: pointer;
                display: flex;
                align-items: center;
                gap: 12px;
            }

            /* Icon Container Context */
            .icon-container {
                position: relative;
                width: 24px;
                height: 24px;
            }

            /* 1. The Glass Lens (Circle) */
            .icon-container .lens {
                position: absolute;
                top: 2px;
                left: 2px;
                width: 14px;
                height: 14px;
                border: 3px solid #333;
                border-radius: 50%;
                transition: all 0.3s ease;
                box-sizing: border-box;
            }

            /* 2. The Stick Handle (Diagonal line) */
            .icon-container .handle {
                position: absolute;
                bottom: 2px;
                right: 2px;
                width: 3px;
                height: 9px;
                background-color: #333;
                transform: rotate(-45deg);
                transform-origin: bottom right;
                transition: all 0.3s ease;
            }

            /* Text Label */
            .toggle-text {
                font-family: sans-serif;
                font-size: 16px;
                color: #333;
                user-select: none;
            }

            /* ---- MORPHING TRANSFORMS (When Menu is Open) ---- */

            /* Lens flattens out into one line of the X */
            .search-toggle.open .lens {
                border-radius: 0;
                width: 3px;
                height: 22px;
                border: none;
                background-color: #333;
                top: 1px;
                left: 11px;
                transform: rotate(45deg);
            }

            /* Handle elongates and rotates into the opposing line of the X */
            .search-toggle.open .handle {
                height: 22px;
                bottom: 1px;
                right: 11px;
                transform: rotate(-45deg);
                transform-origin: center;
            }

            /* ---- COLLAPSIBLE CONTAINER ---- */
            .menu-content {
                display: none;
                background-color: #f9f9f9;
                padding: 15px;
                border: 1px solid #ddd;
                margin-top: 10px;
            }

            .menu-show {
                display: block !important;
            }
        </style>

        <script type="text/javascript">
            function toggleMenu() {
                var menu = document.getElementById("collapsibleMenu");
                var btn = document.getElementById("menuBtn");
                
                var isOpen = menu.classList.toggle("menu-show");
                btn.classList.toggle("open");
                
                btn.setAttribute("aria-expanded", isOpen);
            }
        </script>
