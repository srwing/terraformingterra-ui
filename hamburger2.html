<html>
  <haed></haed>
  <body>
    <!-- The Hamburger Button with Search Text -->
    <button class="hamburger-toggle" id="menuBtn" onclick="toggleMenu()" aria-expanded="false" aria-controls="collapsibleMenu">
      <div class="bars-container">
        <span></span>
        <span></span>
        <span></span>
      </div>
      <span class="toggle-text">Search ...</span>
    </button>

    <!-- The Collapsible Container -->
    <div id="collapsibleMenu" class="menu-content">
      <script async src="https://cse.google.com/cse.js?cx=d6e66471519be4d46"></script>
      <div class="gcse-search"></div>
    </div>

    <style>
    /* Reset default button styling & align text with icon */
    .hamburger-toggle {
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px; /* Space between text and icon */
    }

    /* Container for just the structural bars */
    .bars-container {
      width: 30px;
    }

    /* Base Hamburger Icon Bars */
    .bars-container span {
      display: block;
      height: 4px;
      width: 100%;
      background: #333; /* Icon color */
      margin: 5px 0;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    /* Label text styling */
    .toggle-text {
      font-family: sans-serif;
      font-size: 16px;
      color: #333;
      user-select: none;
    }

    /* ---- ICON TRANSFORMS (When Open) ---- */
    .hamburger-toggle.open .bars-container span:nth-child(1) {
      transform: translateY(9px) rotate(45deg);
    }

    .hamburger-toggle.open .bars-container span:nth-child(2) {
      opacity: 0;
    }

    .hamburger-toggle.open .bars-container span:nth-child(3) {
      transform: translateY(-9px) rotate(-45deg);
    }

    /* ---- COLLAPSIBLE CONTAINER ---- */
    .menu-content {
      display: none; /* Hidden by default */
      background-color: #f9f9f9;
      padding: 15px;
      border: 1px solid #ddd;
      margin-top: 10px;
    }

    /* Class to show the menu */
    .menu-show {
      display: block !important;
    }
    </style>

    <script type="text/javascript">
    function toggleMenu() {
      var menu = document.getElementById("collapsibleMenu");
      var btn = document.getElementById("menuBtn");
      
      // Toggle the content visibility
      var isOpen = menu.classList.toggle("menu-show");
      
      // Toggle the hamburger icon animation state
      btn.classList.toggle("open");
      
      // Update accessibility state for screen readers
      btn.setAttribute("aria-expanded", isOpen);
    }
    </script>
  </body>
</html>
